  # ============================================================================
# MATHPROOF — OpenAPI 3.0 контракт для эндпоинтов:
#   GET  /api/tasks
#   POST /api/verify
#   GET  /api/curriculum
# Источник: §6 документа "иструкция.md"
# Модуль: mod4_api_server.py обязан реализовать эти эндпоинты дословно.
# ============================================================================
openapi: 3.0.3
info:
  title: MATHPROOF API
  version: 1.0.0
  description: >
    Платформа формальных математических доказательств. Контракт публичных
    эндпоинтов каталога задач, проверки посылок и учебной карты.
servers:
  - url: http://127.0.0.1:8000
    description: Локальный сервер (§2.3)

# --------------------------------------------------------------------------
# Общие компоненты
# --------------------------------------------------------------------------
components:
  schemas:
    # --- Базовые типы -----------------------------------------------------
    Task:
      type: object
      required: [id, slug, title, difficulty, xp, category, subcategory, status]
      properties:
        id:              { type: integer }
        slug:            { type: string, example: "la-mx-05" }
        title:           { type: string }
        difficulty:      { type: integer, minimum: 1, maximum: 5 }
        xp:              { type: integer, minimum: 0 }
        category:        { type: string, enum: [linal, analysis, cattheory] }
        subcategory:     { type: string }
        tags:            { type: array,  items: { type: string } }
        prereqs:         { type: array,  items: { type: string } }
        status:          { type: string, enum: [draft, published, archived] }
        wave:            { type: integer }
        statement_latex: { type: string }
        library:         { type: array,  items: { type: string } }

    TaskSummary:
      type: object
      required: [id, slug, title, difficulty, xp, category, subcategory, status]
      properties:
        id:          { type: integer }
        slug:        { type: string }
        title:       { type: string }
        difficulty:  { type: integer }
        xp:          { type: integer }
        category:    { type: string }
        subcategory: { type: string }
        tags:        { type: array,  items: { type: string } }
        status:      { type: string }

    Diagnostic:
      type: object
      required: [severity, message, line, col]
      properties:
        severity: { type: string, enum: [warning, error] }
        message:  { type: string }
        line:     { type: integer }
        col:      { type: integer }
        block_id: { type: [string, "null"], description: "Привязка к блоку доски (§7.6)" }
        object_id:{ type: [string, "null"], description: "Привязка к объекту геометрии (§7.6)" }

    VerifyRequest:
      type: object
      required: [mode, task_id]
      properties:
        mode:
          type: string
          enum: [board, code, geo2d, geo3d]
        task_id:
          type: integer
        board_json:
          type: object
          description: "Обязательно при mode=board (§7.1)"
        lean_source:
          type: string
          description: "Обязательно при mode=code"
        construction_json:
          type: object
          description: "Обязательно при mode=geo2d|geo3d"

    VerifyResponse:
      type: object
      required: [status, diagnostics, elapsed_ms, preview]
      properties:
        status:
          type: string
          enum: [accepted, rejected, error]
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        lean_source:
          type: string
          description: "Итоговый Lean-источник после транспиляции"
        block_map:
          type: object
          additionalProperties:
            type: array
            items: { type: integer, minLength: 2, maxLength: 2 }
          description: "Отображение block_id → [start_line, end_line] для mode=board"
        construction_map:
          type: object
          description: "Отображение object_id/step_id → строки для mode=geo2d|geo3d"
        elapsed_ms:
          type: integer
        preview:
          type: integer
          enum: [0, 1]
          description: "1 = принято preview-слоем без Lean (§10.1)"

    CurriculumNode:
      type: object
      required: [category, subcategory, tasks]
      properties:
        category:    { type: string }
        subcategory: { type: string }
        title:       { type: string }
        tasks:
          type: array
          items:
            type: object
            required: [slug, title, difficulty, xp, prereqs]
            properties:
              slug:       { type: string }
              title:      { type: string }
              difficulty: { type: integer }
              xp:         { type: integer }
              prereqs:    { type: array, items: { type: string } }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:        { type: string }
        instructions: { type: string, description: "Используется при lean_missing (§3.2)" }

  # --- Общие параметры ----------------------------------------------------
  parameters:
    CategoryParam:
      name: category
      in: query
      schema: { type: string, enum: [linal, analysis, cattheory] }
    SubcategoryParam:
      name: subcategory
      in: query
      schema: { type: string }
    DifficultyParam:
      name: difficulty
      in: query
      schema: { type: integer, minimum: 1, maximum: 5 }
    TagParam:
      name: tag
      in: query
      schema: { type: string }
    StatusParam:
      name: status
      in: query
      schema: { type: string, enum: [draft, published, archived] }
      description: "Для публичного API всегда status=published (§6)"

# ==========================================================================
# Эндпоинты
# ==========================================================================
paths:

  # ------------------------------------------------------------------------
  # GET /api/tasks — список задач с фильтрами (§6)
  # ------------------------------------------------------------------------
  /api/tasks:
    get:
      operationId: listTasks
      summary: "Публичный список задач с фильтрами"
      parameters:
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/SubcategoryParam'
        - $ref: '#/components/parameters/DifficultyParam'
        - $ref: '#/components/parameters/TagParam'
        - $ref: '#/components/parameters/StatusParam'
      responses:
        '200':
          description: "Список задач (по умолчанию status=published)"
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskSummary'
        '503':
          description: "Lean отсутствует — некоторые поля могут быть недоступны"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------------------
  # POST /api/verify — конвейер проверки Lean (§7)
  # ------------------------------------------------------------------------
  /api/verify:
    post:
      operationId: verifySubmission
      summary: "Проверка посылки через Lean 4 (конвейер §7)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            examples:
              board_mode:
                summary: "Проверка доски"
                value:
                  mode: board
                  task_id: 1
                  board_json: { blocks: [], edges: [] }
              code_mode:
                summary: "Проверка Lean-кода"
                value:
                  mode: code
                  task_id: 1
                  lean_source: "example : True := trivial"
              geo2d_mode:
                summary: "Проверка 2D-построения"
                value:
                  mode: geo2d
                  task_id: 1
                  construction_json: { objects: [], script: [] }
      responses:
        '200':
          description: "Результат проверки"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: "Некорректный payload (неверный mode/отсутствуют поля)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Задача не найдена"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: "Lean не установлен (§3.2)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "lean_missing"
                instructions: "Запустите python tools/install_lean.py"

  # ------------------------------------------------------------------------
  # GET /api/curriculum — учебная карта (§6, §12.6)
  # ------------------------------------------------------------------------
  /api/curriculum:
    get:
      operationId: getCurriculum
      summary: "Учебная карта: иерархия разделов → подразделов → задач"
      responses:
        '200':
          description: "Дерево учебной карты"
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [category, title, subcategories]
                      properties:
                        category: { type: string }
                        title:    { type: string }
                        subcategories:
                          type: array
                          items:
                            $ref: '#/components/schemas/CurriculumNode'
        '503':
          description: "Lean отсутствует"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'